name: Publish case previews
on:
  # 代码推送仅运行 CI，网站发布由用户决定后手动触发。
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装固定 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$(cat moonbit-toolchain.version)"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: npm run build
      - name: 构建路由观察页面
        run: node scripts/build_site.mjs --output .validation/pages --max-bytes 134217728
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .validation/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署路由观察页面
        id: deployment
        uses: actions/deploy-pages@v4
