<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MRTKit 路由观测复盘</title>
<link rel="stylesheet" href="style.css"></head><body><header><div class="topbar"><a class="brand" href="https://github.com/prowk/mrtkit">MRT<span>KIT</span><small>路由观察</small></a></div><h1 id="title">路由观测复盘</h1><p id="period"></p></header><main>
<p id="quality" class="muted"></p><div class="cards"><div class="card">观测点<strong id="points">—</strong></div><div class="card">明细记录<strong id="rows">—</strong></div><div class="card">变化提醒<strong id="changes">—</strong></div></div>
<section><h2>各观测点的记录</h2><div class="scroll"><table><thead><tr><th>观测点</th><th>处理状态</th><th>记录时段</th><th>缺失时段</th><th>发布 / 撤回</th><th>活动 / 跟踪路由</th></tr></thead><tbody id="coverage"></tbody></table></div></section>
<section><h2>变化记录</h2><div class="filters"><label>观测点<select id="collector"><option value="">全部观测点</option></select></label><label>地址段<input id="prefix" placeholder="203.0.113.0/24"></label><label>相邻网络编号 / IP<input id="peer" placeholder="58952"></label><label>变化类型<select id="kind"><option value="">全部类型</option></select></label><button id="apply">应用筛选</button><button id="cancel">取消</button><button id="reset">重置</button></div><p id="status" class="muted" role="status"></p><div class="scroll"><table><thead><tr><th>UTC 时间</th><th>观测点</th><th>地址段 / 路径编号</th><th>相邻网络</th><th>类型</th><th>差异与来源</th></tr></thead><tbody id="details"></tbody></table></div><div class="pager"><button id="previous">上一页</button><span id="position"></span><button id="next">下一页</button></div></section><section id="correlation-section"><h2>多个观测点的相关变化</h2><p id="correlation-status" role="status"></p><div id="groups"></div><div class="pager"><button id="group-previous">上一组页</button><span id="group-position"></span><button id="group-next">下一组页</button></div><h3>所选组的观测时间与来源</h3><div id="observations"></div><div class="pager"><button id="observation-previous">上一观测页</button><span id="observation-position"></span><button id="observation-next">下一观测页</button></div></section><details class="provenance"><summary>加载详情</summary><p>数据分块 <span id="pages"></span></p></details></main><footer><span>MRTKit · MoonBit 路由分析</span><a href="about.html">演示说明</a></footer><script src="manifest.js"></script><script src="app.js" defer></script></body></html>
