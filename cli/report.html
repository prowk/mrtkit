<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MRTKit 路由观测复盘</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#172b39;background:#f3f6f8;font-size:15px}body{margin:0}header{background:#163749;color:#fff;padding:30px max(24px,calc((100vw - 1220px)/2))}header small{color:#a6dfe6;letter-spacing:.14em}h1{font-size:28px;font-weight:650;margin:10px 0}header p{color:#c3d3dd;margin:8px 0}main{max-width:1220px;margin:24px auto;padding:0 24px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}.card,section{background:#fff;border:1px solid #dfe7ec;border-radius:10px;padding:20px}.card strong{display:block;font-size:26px;margin-top:8px;color:#126873}.muted{color:#627886}.warning{background:#fff3d5;color:#74500a;border:1px solid #edcf89;padding:13px 18px;border-radius:8px;line-height:1.7}section{margin:18px 0}h2{font-size:18px;margin:0 0 16px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #e7edf1;vertical-align:top;font-size:13px}th{color:#58707e;font-weight:600;white-space:nowrap}td{overflow-wrap:anywhere}td.code,code{font-family:Consolas,monospace}label{display:flex;flex-direction:column;gap:7px;font-size:13px;color:#425b69}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end}input,select,button{font:inherit;padding:9px 11px;border:1px solid #c7d5de;border-radius:6px;background:#fff;min-width:0}button{cursor:pointer;background:#166773;color:white;border-color:#166773}button:disabled{opacity:.45;cursor:default}.pager{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin:16px 0 0}.pager button{background:#fff;color:#166773}.scroll{overflow-x:auto}details{margin-top:6px}summary{cursor:pointer;color:#166773}pre{font:12px/1.55 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;max-height:350px;overflow:auto;background:#f4f7f9;padding:12px;min-width:240px}.pill{display:inline-block;background:#e6f3f2;color:#1f6866;border-radius:4px;padding:3px 7px;white-space:nowrap}.bad{background:#fff1d8;color:#875b06}.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.value{overflow-wrap:anywhere;white-space:pre-wrap}.group{border-bottom:1px solid #e7edf1;padding:14px 0}.empty{text-align:center;color:#71838d;padding:36px}footer{text-align:center;color:#71838d;padding:20px;font-size:12px}@media(max-width:800px){.cards{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}header{padding:24px}main{padding:0 12px}section{padding:14px}h1{font-size:24px}}
</style></head><body><header><small>MRTKIT · OFFLINE OBSERVATIONS</small><h1 id="title">路由观测复盘</h1><p id="period"></p><p>采集器观测用于排查与研究，不代表实际业务中断或事件因果。</p></header><main>
<div id="quality" class="warning"></div><div class="cards"><div class="card">观测点<strong id="points">—</strong></div><div class="card">明细记录<strong id="rows">—</strong></div><div class="card">变化提醒<strong id="changes">—</strong></div><div class="card">按需加载的数据页<strong id="pages">—</strong></div></div>
<section><h2>观测点分布与输入质量</h2><div class="scroll"><table><thead><tr><th>采集器 / 视图</th><th>输入</th><th>基线</th><th>连续性 / 缺档</th><th>宣告 / 撤回</th><th>活动 / 缓存状态</th></tr></thead><tbody id="coverage"></tbody></table></div></section>
<section><h2>时间线与变化明细</h2><div class="filters"><label>采集器 / 视图<select id="collector"><option value="">全部观测点</option></select></label><label>前缀（精确）<input id="prefix" placeholder="203.0.113.0/24"></label><label>Peer ASN / IP（精确）<input id="peer" placeholder="58952"></label><label>变化 / 观测类型<select id="kind"><option value="">全部类型</option></select></label><button id="apply">应用筛选</button><button id="cancel">取消</button><button id="reset">重置</button></div><p id="status" class="muted" role="status"></p><div class="scroll"><table><thead><tr><th>UTC 时间</th><th>观测点</th><th>前缀 / Path ID</th><th>Peer</th><th>类型</th><th>差异与来源</th></tr></thead><tbody id="details"></tbody></table></div><div class="pager"><button id="previous">上一页</button><span id="position"></span><button id="next">下一页</button></div></section><section><h2>跨采集器关联</h2><p>时间接近表示观测共现，不代表传播时延或因果。未观测到匹配提醒不表示路由未发生变化。</p><p id="correlation-status" role="status"></p><div id="groups"></div><div class="pager"><button id="group-previous">上一组页</button><span id="group-position"></span><button id="group-next">下一组页</button></div><h3>所选组的观测时间与来源</h3><div id="observations"></div><div class="pager"><button id="observation-previous">上一观测页</button><span id="observation-position"></span><button id="observation-next">下一观测页</button></div></section></main><footer>结构化输出版本 2.0 · 全部资源在本地 · 来源偏移是解压后的记录起点</footer><script src="manifest.js"></script><script src="app.js" defer></script></body></html>
